name: CI - EBAC Shop
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ebac-${{ github.ref }}
  cancel-in-progress: false
jobs:
  testes-api:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:api -- --ci --runInBand
  testes-web:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx cypress run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: diagnosticos-cypress
          path: |
            cypress/screenshots
            cypress/videos
          if-no-files-found: ignore
